{% extends "base.html" %}

{% block title %}Server Error{% endblock %}

{% block content %}
<div class="container text-center py-5">
    <i class="bi bi-exclamation-circle display-1 text-danger"></i>
    <h1 class="display-4 mt-4">500 - Server Error</h1>
    <p class="lead">Something went wrong on our end. Please try again later.</p>
    <a href="{{ url_for('index') }}" class="btn btn-primary mt-3">
        <i class="bi bi-house-door"></i> Go Home
    </a>
</div>
{% endblock %}
